[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s x24 -ac
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:xfce]
command=/usr/bin/startxfce4
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=200
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.log

[program:x11vnc]
command=/bin/bash -c "sleep 5 && exec /usr/bin/x11vnc -display :1 -rfbauth /root/.vnc/passwd -rfbport 5900 -forever -shared -noxdamage"
autorestart=true
priority=300
startsecs=8
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=/bin/bash -c "sleep 8 && exec /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080"
autorestart=true
priority=400
startsecs=10
startretries=10
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log
