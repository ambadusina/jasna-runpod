[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root
[unix_http_server]
file=/var/run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=50
startretries=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log
[program:xvfb]
command=/bin/bash -c "rm -f /tmp/.X1-lock /tmp/.X11-unix/X1; exec /usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)sx24 -ac -nolisten tcp"
autorestart=true
priority=100
startretries=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log
[program:x11vnc]
command=/bin/bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.5; done; exec /usr/bin/x11vnc -display :1 -nopw -rfbport 5900 -forever -shared -noxdamage"
autorestart=true
priority=200
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log
[program:xfce]
command=/bin/bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.5; done; exec /usr/bin/xfce4-session"
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=300
startretries=10
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.log
[program:jupyter]
command=/opt/jupyter-venv/bin/jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.root_dir=/ --ServerApp.allow_origin='*' --ServerApp.allow_origin_pat='.*' --ServerApp.allow_remote_access=True --ServerApp.disable_check_xsrf=True --ServerApp.terminals_enabled=True --FileContentsManager.delete_to_trash=False --FileContentsManager.always_delete_dir=True
autorestart=true
priority=350
startretries=10
stdout_logfile=/var/log/supervisor/jupyter.log
stderr_logfile=/var/log/supervisor/jupyter.log
[program:novnc]
command=/bin/bash -c "until nc -z localhost 5900; do sleep 0.5; done; exec /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080"
autorestart=true
priority=400
startretries=10
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log
